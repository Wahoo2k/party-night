# Brings a picture into art/ from a web address, sized for the game. Used for artwork made outside this repository:
# run it by hand with the file name (no extension) and the picture's address.
name: Fetch art
on:
  workflow_dispatch:
    inputs:
      name: { description: 'File name in art/, without .jpg (letters, digits and dashes)', required: true }
      url: { description: 'https address of the picture', required: true }
      width: { description: 'Width in pixels', default: '1200' }
permissions:
  contents: write
concurrency: { group: fetch-art, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and resize
        env:
          NAME: ${{ inputs.name }}
          URL: ${{ inputs.url }}
          WIDTH: ${{ inputs.width }}
        run: |
          set -e
          echo "$NAME" | grep -Eq '^[a-z0-9-]{1,40}$' || { echo "bad name"; exit 1; }
          echo "$URL" | grep -Eq '^https://' || { echo "bad address"; exit 1; }
          echo "$WIDTH" | grep -Eq '^[0-9]{3,4}$' || { echo "bad width"; exit 1; }
          curl -fsSL --max-time 60 --max-filesize 30000000 -o /tmp/in "$URL"
          file /tmp/in | grep -Eqi 'image data' || { echo "not a picture"; file /tmp/in; exit 1; }
          sudo apt-get install -y -qq imagemagick >/dev/null
          convert /tmp/in -auto-orient -resize "${WIDTH}x" -strip -quality 86 "art/$NAME.jpg"
          ls -la "art/$NAME.jpg"
      - name: Commit
        env: { NAME: '${{ inputs.name }}' }
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "art/$NAME.jpg"
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Art: $NAME"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 3; done
